<meta charset="utf-8">
<title>Versiones</title>
<style>
/* ============ tokens ============ */
:root{
  --bg-canvas:#FFFFFF; --bg-raised:#F7F7F8; --bg-hover:#F0F0F1; --bg-selection:#D6E4FF;
  --text-primary:#1A1A1A; --text-secondary:#6B6B70; --text-tertiary:#A0A0A6;
  --border-subtle:#E8E8EA; --border-strong:#D4D4D8;
  --accent:#2563EB; --accent-hover:#1D4ED8; --accent-soft:#EFF6FF; --accent-ink:#FFFFFF;
  --warn:#D97706; --danger:#DC2626; --caret:#1A1A1A;
  --shadow-popover:0 0 0 1px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.06),0 12px 32px rgba(0,0,0,.08);

  --font-editor:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --font-ui:var(--font-editor);
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --text-editor-size:18px; --text-editor-line:1.65; --text-editor-spacing:-0.011em;
  --text-ui-size:14px; --text-meta-size:12px;

  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;
  --space-6:24px; --space-8:32px; --space-10:40px; --space-12:48px; --space-16:64px;
  --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-full:999px;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-inout:cubic-bezier(.32,.72,0,1);
  --dur-instant:80ms; --dur-fast:150ms; --dur-base:200ms;

  --col:680px;
  --wide:1180px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg-canvas:#0E0E10; --bg-raised:#18181B; --bg-hover:#232327; --bg-selection:#1E3A5F;
    --text-primary:#EDEDEF; --text-secondary:#9B9BA3; --text-tertiary:#6A6A73;
    --border-subtle:#232327; --border-strong:#33333A;
    --accent:#60A5FA; --accent-hover:#93C5FD; --accent-soft:#16233A; --accent-ink:#0E0E10;
    --warn:#F59E0B; --danger:#F87171; --caret:#EDEDEF;
    --shadow-popover:0 0 0 1px rgba(255,255,255,.06),0 8px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg-canvas:#0E0E10; --bg-raised:#18181B; --bg-hover:#232327; --bg-selection:#1E3A5F;
  --text-primary:#EDEDEF; --text-secondary:#9B9BA3; --text-tertiary:#6A6A73;
  --border-subtle:#232327; --border-strong:#33333A;
  --accent:#60A5FA; --accent-hover:#93C5FD; --accent-soft:#16233A; --accent-ink:#0E0E10;
  --warn:#F59E0B; --danger:#F87171; --caret:#EDEDEF;
  --shadow-popover:0 0 0 1px rgba(255,255,255,.06),0 8px 24px rgba(0,0,0,.5);
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

*{box-sizing:border-box}
/* Los elementos de la barra se crean una vez y se prenden con `hidden`. Sin esto, un
   `display:flex` propio le gana a la regla del navegador y el elemento se ve igual. */
[hidden]{display:none!important}
body{
  margin:0;background:var(--bg-canvas);color:var(--text-primary);
  font-family:var(--font-ui);font-size:var(--text-ui-size);line-height:1.45;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  padding-bottom:var(--space-16);
}
::selection{background:var(--bg-selection)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--radius-sm)}
a{color:var(--accent)}

/* ============ header ============ */
/* La fila de borradores y la cabecera van pegadas arriba juntas: pedido del usuario el
   2026-10-13, para cambiar de borrador sin volver a subir. */
.cabeza{position:sticky;top:0;z-index:40;background:var(--bg-canvas)}
html{scroll-padding-top:112px}
html:has(.thread:not([hidden])){scroll-padding-top:160px}
.top{background:var(--bg-canvas);border-bottom:1px solid transparent;
     transition:border-color var(--dur-fast) var(--ease-out)}
.top.is-scrolled{border-bottom-color:var(--border-subtle)}
.top-in{max-width:var(--wide);margin-inline:auto;height:56px;display:flex;align-items:center;
        gap:var(--space-3);padding-inline:var(--space-6)}
.crumb{display:flex;gap:var(--space-3);min-width:0;font-size:var(--text-meta-size);
       color:var(--text-tertiary);font-family:var(--font-mono);white-space:nowrap;overflow:hidden}
.crumb span{overflow:hidden;text-overflow:ellipsis}
.crumb span+span::before{content:"·";margin-right:var(--space-3);color:var(--border-strong)}
.grow{flex:1}
.dbstate{font-size:var(--text-meta-size);color:var(--text-tertiary);min-width:112px;text-align:right;
         font-variant-numeric:tabular-nums}
.dbstate.is-bad{color:var(--warn)}
.icon{width:28px;height:28px;display:grid;place-items:center;border:0;background:none;padding:0;
      border-radius:var(--radius-md);color:var(--text-secondary);opacity:.55;cursor:pointer;
      transition:opacity var(--dur-instant),background var(--dur-instant)}
.icon:hover{opacity:1;background:var(--bg-hover)}
.icon svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;
          stroke-linecap:round;stroke-linejoin:round}

/* ============ shell ============ */
.shell{max-width:var(--wide);margin-inline:auto;padding:var(--space-10) var(--space-6) 0}
.intro{max-width:var(--col)}
h1{font-size:24px;font-weight:600;line-height:1.25;letter-spacing:-.02em;margin:0 0 var(--space-2)}
.sub{margin:0;color:var(--text-secondary);font-size:var(--text-ui-size)}

/* pestañas de borradores, arriba de todo */
.drafts{display:flex;gap:var(--space-1);align-items:center;flex-wrap:wrap;
        padding:var(--space-2) var(--space-4);background:var(--bg-raised);
        border-bottom:1px solid var(--border-subtle)}
.dtab{display:inline-flex;align-items:center;gap:var(--space-1);border:1px solid transparent;
      border-radius:var(--radius-md);padding:3px var(--space-2) 3px var(--space-3);font-size:12px}
.dtab a{color:var(--text-secondary);text-decoration:none;white-space:nowrap}
.dtab:hover{background:var(--bg-hover)}
.dtab:hover a{color:var(--text-primary)}
.dtab[aria-current="page"]{background:var(--bg-canvas);border-color:var(--border-subtle)}
.dtab[aria-current="page"] a{color:var(--text-primary);font-weight:600}
.dtab{flex-shrink:0}
/* Borrador que llego mientras el usuario trabajaba en otro: la pagina no lo abre sola. */
.dtab .nuevo{width:6px;height:6px;border-radius:var(--radius-full);background:var(--accent)}
.dtab .x{opacity:0;border:0;background:none;color:inherit;cursor:pointer;font:inherit;
         font-size:15px;line-height:1;padding:0 2px;transition:opacity var(--dur-instant)}
.dtab:hover .x,.dtab[aria-current="page"] .x{opacity:.45}
.dtab .x:hover{opacity:1}

/* pestañas de mensajes */
/* Van dentro de .cabeza, pegadas arriba con la cabecera: pedido del usuario el 2026-11-05,
   para cambiar de mensaje del hilo sin volver a subir. */
.thread{display:flex;gap:var(--space-1);flex-wrap:wrap;background:var(--bg-canvas);
        padding:var(--space-2) max(var(--space-6), calc((100% - var(--wide)) / 2 + var(--space-6)));
        border-bottom:1px solid transparent;transition:border-color var(--dur-fast) var(--ease-out)}
.cabeza:has(.thread:not([hidden])) .top{border-bottom-color:transparent}
.cabeza:has(.top.is-scrolled) .thread{border-bottom-color:var(--border-subtle)}
.tab{display:inline-flex;align-items:center;gap:var(--space-2);border:1px solid var(--border-subtle);
     background:var(--bg-canvas);color:var(--text-secondary);border-radius:var(--radius-full);
     padding:6px var(--space-4);font:inherit;font-size:13px;cursor:pointer;
     transition:background var(--dur-instant),color var(--dur-instant),border-color var(--dur-instant)}
.tab:hover{background:var(--bg-hover)}
.tab[aria-selected="true"]{background:var(--text-primary);border-color:var(--text-primary);color:var(--bg-canvas)}
.tab .dot{width:6px;height:6px;border-radius:var(--radius-full);background:var(--warn)}
.tab .tick{color:var(--accent);font-size:11px}
.tab[aria-selected="true"] .tick{color:var(--bg-canvas)}

.deck{display:flex;align-items:center;gap:var(--space-4);margin:var(--space-8) 0 var(--space-6);
      flex-wrap:wrap}
.modes{display:inline-flex;background:var(--bg-raised);border-radius:var(--radius-md);padding:2px}
.modes button{border:0;background:none;font:inherit;font-size:13px;color:var(--text-secondary);
              padding:5px var(--space-3);border-radius:var(--radius-sm);cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--bg-canvas);color:var(--text-primary);
                                   box-shadow:0 0 0 1px var(--border-subtle)}
.counts{display:flex;gap:var(--space-4);list-style:none;margin:0;padding:0;
        font-size:var(--text-meta-size);color:var(--text-tertiary);font-variant-numeric:tabular-nums}
.counts b{font-weight:500;color:var(--text-secondary)}
.pending-head{display:flex;align-items:center;gap:var(--space-2);margin:0;
              font-size:var(--text-meta-size);color:var(--warn)}
.pending-head b{display:grid;place-items:center;min-width:18px;height:18px;padding:0 5px;
                border-radius:var(--radius-full);background:var(--warn);color:var(--bg-canvas);font-size:11px}

/* ============ filas ============ */
.rows>section{padding:var(--space-8) 0;border-top:1px solid var(--border-subtle)}
.rows>section:first-child{border-top:0;padding-top:0}
.row-head{display:flex;align-items:baseline;gap:var(--space-3);margin-bottom:var(--space-4);flex-wrap:wrap}
.row-n{font-family:var(--font-mono);font-size:var(--text-meta-size);color:var(--text-tertiary)}
.row-head h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.row-job{margin:0;color:var(--text-secondary);font-size:var(--text-meta-size);
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46ch}
.chips{display:flex;gap:var(--space-2);margin-left:auto}
.chip{font-size:11px;padding:2px var(--space-2);border-radius:var(--radius-sm);
      background:var(--accent-soft);color:var(--accent)}
.chip.is-note{background:transparent;color:var(--warn);box-shadow:inset 0 0 0 1px currentColor}

.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3);align-items:start}
.opts.has-drop{grid-template-columns:repeat(3,1fr) 128px}
.opt{border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:var(--space-4);
     background:var(--bg-canvas);cursor:pointer;
     transition:border-color var(--dur-instant),background var(--dur-instant)}
.opt:hover{background:var(--bg-raised)}
.opt[aria-pressed="true"]{border-color:var(--border-strong);background:var(--bg-canvas);cursor:default}
.opt.is-drop{display:flex;flex-direction:column}
.opt-top{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3)}
.check{width:14px;height:14px;border-radius:var(--radius-full);border:1.5px solid var(--border-strong);flex:none;
       transition:border-color var(--dur-instant),background var(--dur-instant)}
.opt[aria-pressed="true"] .check{border-color:var(--accent);background:var(--accent);
     box-shadow:inset 0 0 0 2.5px var(--bg-canvas)}
.tag{font-size:var(--text-meta-size);font-weight:600;letter-spacing:.02em;text-transform:uppercase;
     color:var(--text-secondary)}
.opt[aria-pressed="true"] .tag{color:var(--text-primary)}
.rec{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);
     background:var(--accent-soft);padding:1px 5px;border-radius:var(--radius-sm)}
.wc{margin-left:auto;font-size:var(--text-meta-size);color:var(--text-tertiary);
    font-variant-numeric:tabular-nums}

.txt{margin:0;font-family:var(--font-editor);font-size:16px;line-height:1.55;
     letter-spacing:var(--text-editor-spacing);color:var(--text-secondary);white-space:pre-wrap;
     word-break:break-word}
.opt[aria-pressed="true"] .txt{color:var(--text-primary)}
.opt[aria-pressed="true"] .txt{caret-color:var(--caret);outline:none;cursor:text}
.txt:focus{outline:none}
.txt ul,.txt ol{margin:.2em 0 .2em;padding-left:1.35em}
.txt li{margin:0}
.txt code{font-family:var(--font-mono);font-size:.9em;background:var(--bg-raised);
          padding:.15em .35em;border-radius:var(--radius-sm)}
.txt strong{font-weight:650}
.note{margin:var(--space-3) 0 0;font-size:var(--text-meta-size);line-height:1.45;color:var(--text-secondary)}
.opt.is-drop .txt{color:var(--text-tertiary);font-size:13px}

.row-foot{display:flex;align-items:center;gap:var(--space-4);margin-top:var(--space-3);flex-wrap:wrap}
.lnk{border:0;background:none;padding:0;font:inherit;font-size:var(--text-meta-size);
     color:var(--text-secondary);cursor:pointer;text-decoration:underline;
     text-decoration-color:var(--border-strong);text-underline-offset:3px}
.lnk:hover{color:var(--text-primary)}
.foot-hint{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);margin-left:auto}
.fmt-hint{font-size:11px;color:var(--text-tertiary);opacity:0;transition:opacity var(--dur-fast) var(--ease-out)}
.fmt-hint.is-on{opacity:1}
.fmt-hint b{font-weight:600;color:var(--text-secondary)}

.notebox{margin-top:var(--space-4);border-left:2px solid var(--warn);padding:var(--space-1) 0 var(--space-1) var(--space-4)}
.notebox label{display:block;font-size:var(--text-meta-size);font-weight:600;color:var(--warn)}
.notebox p{margin:2px 0 var(--space-2);font-size:var(--text-meta-size);color:var(--text-secondary)}
textarea{width:100%;max-width:var(--col);font:inherit;font-size:var(--text-ui-size);color:var(--text-primary);
         background:var(--bg-canvas);border:1px solid var(--border-subtle);border-radius:var(--radius-md);
         padding:var(--space-2) var(--space-3);resize:vertical}
textarea:focus{outline:none;border-color:var(--border-strong)}
textarea::placeholder{color:var(--text-tertiary)}

/* ============ leer las tres ============ */
.fulls{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-6)}
.full h3{margin:0 0 var(--space-3);font-size:var(--text-meta-size);text-transform:uppercase;
         letter-spacing:.04em;color:var(--text-secondary);display:flex;gap:var(--space-2)}
.full h3 em{font-style:normal;color:var(--text-tertiary);font-weight:400}
.full .body{font-family:var(--font-editor);font-size:15px;line-height:1.6;color:var(--text-secondary)}
.full .body p{margin:0 0 .85em}

/* ============ armado ============ */
.assembled{max-width:var(--col);margin:var(--space-16) 0 0;border-top:1px solid var(--border-subtle);
           padding-top:var(--space-8)}
.assembled h2{margin:0 0 var(--space-2);font-size:15px;font-weight:600}
.letter{border:1px solid var(--border-subtle);border-radius:var(--radius-lg);overflow:hidden}
.letter .meta{display:flex;flex-direction:column;gap:2px;padding:var(--space-3) var(--space-5);
              background:var(--bg-raised);font-size:var(--text-meta-size);color:var(--text-secondary);
              font-family:var(--font-mono)}
.letter .body{padding:var(--space-6) var(--space-5);font-family:var(--font-editor);
              font-size:var(--text-editor-size);line-height:var(--text-editor-line);
              letter-spacing:var(--text-editor-spacing)}
.letter .body p{margin:0 0 .85em}
.letter .body .gap{height:.85em}
.letter .body ul+.gap,.letter .body ol+.gap{display:none}
.letter .body p:last-child{margin-bottom:0}
.letter .body ul,.letter .body ol{margin:0 0 .85em;padding-left:1.35em}
.letter .body code{font-family:var(--font-mono);font-size:.9em;background:var(--bg-raised);
                   padding:.15em .35em;border-radius:var(--radius-sm)}
/* Lo que sale se edita por seccion: cada .seg es su propia caja editable, asi una seleccion
   nunca cruza dos secciones. Una seccion pegada a la anterior corre en el mismo parrafo: las
   dos cajas pasan a inline y la costura (ultima linea de una, primera de la otra) queda en un
   mismo renglon. */
.letter .body .seg{outline:none;border-radius:var(--radius-sm);transition:background var(--dur-fast) var(--ease-out)}
.letter .body .seg:hover{background:var(--bg-hover)}
.letter .body .seg:focus{background:var(--bg-raised)}
.letter .body .seg>:last-child{margin-bottom:0}
.letter .body .seg.pegada,.letter .body .seg.pega-sig{display:inline}
.letter .body .seg.pega-sig>:last-child,.letter .body .seg.pegada>:first-child{display:inline}
.letter .body .seg.pegada::before{content:" "}
.letter .body .mk{border-bottom:1px dotted var(--border-strong)}
.letter .body .costura{position:relative;height:.85em}
.letter .body .costura[hidden],.letter .body .costura button[hidden]{display:none}
.letter .body .costura button{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  border:1px solid var(--border-subtle);border-radius:var(--radius-sm);background:var(--bg-canvas);
  color:var(--text-secondary);font:inherit;font-family:var(--font-ui, inherit);font-size:11px;
  line-height:1;padding:3px var(--space-2);cursor:pointer;opacity:0;
  transition:opacity var(--dur-fast) var(--ease-out)}
.letter .body .costura button::after{content:"Unir"}
.letter .body .costura:hover button,.letter .body .costura button:focus-visible{opacity:1}
.out-hint{margin:0 0 var(--space-3);font-size:var(--text-meta-size);color:var(--text-tertiary)}
.attach{margin-top:var(--space-4);font-size:var(--text-meta-size);color:var(--text-secondary)}
.attach h3{margin:0 0 var(--space-2);font-size:var(--text-meta-size);text-transform:uppercase;
           letter-spacing:.04em;color:var(--text-tertiary)}
.attach ul{margin:0;padding-left:1.1em}
.attach .why{color:var(--text-tertiary)}
.attach .foot{margin:var(--space-2) 0 0;color:var(--text-tertiary)}
.general{margin-top:var(--space-8)}
.general label{display:block;font-size:var(--text-meta-size);font-weight:600;margin-bottom:2px}
.general p{margin:0 0 var(--space-2);font-size:var(--text-meta-size);color:var(--text-secondary)}

/* ============ barra ============ */
.bar{position:sticky;bottom:0;z-index:40;margin-top:var(--space-12);
     background:color-mix(in srgb,var(--bg-canvas) 85%,transparent);
     backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
     border-top:1px solid var(--border-subtle)}
.bar-in{max-width:var(--wide);margin-inline:auto;min-height:56px;display:flex;align-items:center;
        gap:var(--space-4);padding:var(--space-2) var(--space-6);flex-wrap:wrap}
.tally{font-size:var(--text-meta-size);color:var(--text-secondary);font-variant-numeric:tabular-nums}
.tally b{font-size:var(--text-ui-size);color:var(--text-primary)}
.delta{color:var(--text-tertiary)}
.recipe{display:none;font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34ch}
.pending-bar{font-size:var(--text-meta-size);color:var(--warn)}
.bar-acts{margin-left:auto;display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--border-subtle);background:var(--bg-canvas);color:var(--text-secondary);
     font:inherit;font-size:13px;padding:7px var(--space-4);border-radius:var(--radius-md);cursor:pointer;
     transition:background var(--dur-instant),color var(--dur-instant),border-color var(--dur-instant)}
.btn:hover{background:var(--bg-hover);color:var(--text-primary)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--accent-ink)}
.btn.ghost-done{background:var(--accent-soft);border-color:transparent;color:var(--accent)}

/* ============ hoja de envío ============ */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.2)}
.sheet{position:fixed;z-index:61;right:var(--space-6);bottom:76px;width:320px;
       background:var(--bg-raised);border-radius:var(--radius-lg);box-shadow:var(--shadow-popover);
       padding:var(--space-2);animation:pop var(--dur-fast) var(--ease-out)}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.sheet h3{margin:var(--space-2) var(--space-3) var(--space-2);font-size:var(--text-meta-size);
          text-transform:uppercase;letter-spacing:.04em;color:var(--text-tertiary);font-weight:600}
.opt-row{display:flex;align-items:center;gap:var(--space-3);width:100%;border:0;background:none;
         font:inherit;text-align:left;padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);
         cursor:pointer;color:var(--text-primary)}
.opt-row:hover,.opt-row.is-on{background:var(--bg-hover)}
.opt-row .ic{width:20px;display:grid;place-items:center;color:var(--text-secondary)}
.opt-row .ic svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;
                 stroke-linecap:round;stroke-linejoin:round}
.opt-row small{display:block;color:var(--text-tertiary);font-size:var(--text-meta-size)}
.opt-row.opt-static{cursor:default}
.opt-row.sug{box-shadow:inset 2px 0 0 var(--accent)}
.opt-row.sug .ic{color:var(--accent)}
.opt-row.sug small.warn{color:var(--warn)}
.opt-row.opt-static:hover{background:none}
.horas{display:flex;gap:var(--space-1);margin-left:auto}
.horas button{font:inherit;font-size:12px;font-weight:600;line-height:1;cursor:pointer;
              color:var(--text-secondary);background:var(--bg-canvas);
              border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:5px 7px}
.horas button:hover{background:var(--bg-hover);color:var(--text-primary)}
.horas button.def{border-color:var(--accent);color:var(--accent)}
.when{display:flex;gap:var(--space-2);padding:0 var(--space-3) var(--space-2)}
.when input{flex:1;min-width:0;font:inherit;font-size:13px;color:var(--text-primary);
            background:var(--bg-canvas);border:1px solid var(--border-subtle);
            border-radius:var(--radius-md);padding:6px var(--space-2)}
.pick{padding:var(--space-1) var(--space-3) var(--space-2)}
.pick .lbl{font-size:var(--text-meta-size);color:var(--text-tertiary);margin:var(--space-2) 0 var(--space-1)}
.chips{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.chips button{font:inherit;font-size:12px;font-weight:600;line-height:1;cursor:pointer;
              color:var(--text-secondary);background:var(--bg-canvas);
              border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:6px 8px}
.chips button:hover:not(:disabled){background:var(--bg-hover);color:var(--text-primary)}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips button:disabled{opacity:.35;cursor:default}
.resumen{margin:var(--space-2) var(--space-3) var(--space-1);font-size:13px;color:var(--text-primary)}
.resumen small{display:block;color:var(--warn);font-size:var(--text-meta-size);margin-top:2px}
.resumen.mal{color:var(--warn)}
.sheet .go{margin:0 var(--space-1) var(--space-1);width:calc(100% - var(--space-2))}
.sheet .cancel{color:var(--text-tertiary)}

.sent{display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-meta-size);
      color:var(--accent);background:var(--accent-soft);padding:5px var(--space-3);
      border-radius:var(--radius-full)}
.sent .x{border:0;background:none;color:inherit;cursor:pointer;font:inherit;opacity:.7;padding:0 2px}
.sent .x:hover{opacity:1}
.sent.is-stale{color:var(--warn);background:transparent;box-shadow:inset 0 0 0 1px currentColor}
#reset{margin-right:var(--space-3)}
.ask{display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-meta-size);
     color:var(--text-secondary)}
.ask .btn{padding:2px 10px}

#confetti{position:fixed;inset:0;z-index:70;pointer-events:none}
/* Pedir cambios: acuse sutil sobre el boton, el confeti queda para enviar y copiar */
.btn.is-acuse{animation:acuse .7s cubic-bezier(.2,.8,.2,1)}
@keyframes acuse{0%{transform:scale(.94);box-shadow:0 0 0 0 var(--accent)}45%{transform:scale(1.03)}100%{transform:scale(1);box-shadow:0 0 0 10px transparent}}
@media (prefers-reduced-motion:reduce){.btn.is-acuse{animation:none}}

/* ============ responsive ============ */
@media (max-width:1023px){
  .opts,.opts.has-drop{grid-template-columns:1fr}
  .opt:not([aria-pressed="true"]) .txt{max-height:5.2em;overflow:hidden;
       -webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
  .fulls{grid-template-columns:1fr}
}
@media (max-width:767px){
  :root{--text-editor-size:17px}
  .shell,.top-in,.bar-in{padding-inline:var(--space-5)}
  .recipe{display:none}
  .crumb span+span{display:none}
  /* Una sola linea que se desliza de lado: con muchos borradores la fila pegada arriba
     se comeria media pantalla del telefono. */
  .drafts{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .drafts::-webkit-scrollbar{display:none}
  .thread{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-inline:var(--space-5)}
  .thread::-webkit-scrollbar{display:none}
  .tab{flex-shrink:0}
  .sheet{left:var(--space-4);right:var(--space-4);width:auto}
}
@media print{.top,.bar,.modes,.row-foot,.notebox,.thread,.drafts{display:none}}

<script id="draft" type="application/json"></script>
<script id="boot" data-defecto="__DEFECTO__">
(function(){
  "use strict";
  /* El borrador ya no viaja adentro del HTML: se pide como archivo vecino, d/<id>.json.
     Asi la cascara queda en ~3 KB y el `read` del artifact deja de arrastrar el texto
     entero en cada republicacion. OJO: con fetch la pagina NO corre abierta como
     file://. Para probar local hay que servirla por HTTP. */
  var DEFECTO = document.getElementById("boot").getAttribute("data-defecto") || "";
  var CERRADOS = "versiones:cerrados";
  /* Cada republicacion recarga el iframe SIN el ?d= (medido el 2026-10-13 con una sonda),
     asi que la pagina abria el DEFECTO, o sea el borrador recien publicado, aunque el usuario
     estuviera trabajando en otro. ABIERTO lo recuerda en sessionStorage: sobrevive a esa
     recarga y muere al cerrar la pestaña del navegador, asi que el link abierto de cero
     sigue abriendo el ultimo publicado. VISTOS (localStorage) marca con un punto los
     borradores que todavia no abrio nunca. */
  var ABIERTO = "versiones:abierto";
  var VISTOS = "versiones:vistos";
  var SCROLL = "versiones:scroll:";
  function ssGet(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }
  function ssSet(k, v){ try{ sessionStorage.setItem(k, v); }catch(e){} }
  function leerVistos(){
    try{ return JSON.parse(localStorage.getItem(VISTOS) || "null"); }catch(e){ return null; }
  }
  function guardarVistos(l){
    try{ localStorage.setItem(VISTOS, JSON.stringify(l)); }catch(e){}
  }
  function marcarVisto(id){
    var vs = leerVistos() || [];
    if(vs.indexOf(id) < 0){ vs.push(id); guardarVistos(vs); }
  }
  var qs = new URLSearchParams(location.search);
  var actual = qs.get("d") || DEFECTO;
  var nav = document.getElementById("drafts");
  var INDICE = {drafts: []};

  function leerCerrados(){
    try{ return JSON.parse(localStorage.getItem(CERRADOS) || "[]") || []; }catch(e){ return []; }
  }
  function guardarCerrados(l){
    try{ localStorage.setItem(CERRADOS, JSON.stringify(l)); }catch(e){}
  }
  /* El borrador abierto siempre se muestra, aunque este cerrado: si el usuario llego
     por su URL, esconderle el tab lo dejaria sin saber donde esta parado. */
  function vivos(){
    var cs = leerCerrados();
    return (INDICE.drafts || []).filter(function(x){
      return x.id === actual || cs.indexOf(x.id) < 0;
    });
  }
  function conBase(fn){
    if(!(window.claude && typeof window.claude.use === "function")) return;
    window.claude.use("db").then(function(db){ if(db) fn(db); }, function(){});
  }

  /* Un borrador sin doc en la base necesita dos idas (update falla, despues set). Si la
     pagina navega antes de la segunda, el cierre queda solo en este navegador: paso el
     2026-09-28 con cuatro borradores. Por eso se espera la escritura, con tope de 3 s. */
  function cerrarEnBase(id){
    return new Promise(function(res){
      if(!(window.claude && typeof window.claude.use === "function")) return res();
      var tope = setTimeout(res, 3000);
      function fin(){ clearTimeout(tope); res(); }
      window.claude.use("db").then(function(db){
        if(!db) return fin();
        var ref = db.doc("drafts/" + id);
        var dato = {cerrado:true, cerradoPor:"pagina", cerradoTs:new Date().toISOString()};
        ref.update(dato).then(fin, function(e){
          if(e && e.code === "invalid_argument") ref.set(dato).then(fin, fin);
          else fin();
        });
      }, fin);
    });
  }

  function cerrar(x){
    var cs = leerCerrados();
    if(cs.indexOf(x.id) < 0){ cs.push(x.id); guardarCerrados(cs); }
    var escrito = cerrarEnBase(x.id);
    if(x.id === actual){
      var resto = vivos().filter(function(y){ return y.id !== actual; });
      /* Si era el ultimo, "?vacio" en vez de "": sin parametro la pagina abriria
         el DEFECTO, que puede ser justo el que se acaba de cerrar. */
      escrito.then(function(){
        location.search = resto.length ? "?d=" + encodeURIComponent(resto[0].id) : "?vacio=1";
      });
      return;
    }
    pintar();
  }

  /* Pedido del usuario el 2026-10-08: con un solo borrador la fila igual se muestra,
     porque es la unica forma de llegar a su ✕ y dejar la pagina vacia. */
  function pintar(){
    var lista = vivos();
    nav.textContent = "";
    if(!lista.length){ nav.hidden = true; return; }
    nav.hidden = false;
    lista.forEach(function(x){
      var cont = document.createElement("span");
      cont.className = "dtab";
      if(x.id === actual) cont.setAttribute("aria-current", "page");
      var vs = leerVistos();
      if(vs && vs.indexOf(x.id) < 0 && x.id !== actual){
        var nuevo = document.createElement("span");
        nuevo.className = "nuevo"; nuevo.title = "Nuevo: todavía no lo abriste";
        cont.appendChild(nuevo);
      }
      var a = document.createElement("a");
      a.href = "?d=" + encodeURIComponent(x.id);
      a.textContent = x.tab || x.titulo || x.id;
      a.title = x.titulo || x.id;
      cont.appendChild(a);
      var b = document.createElement("button");
      b.type = "button"; b.className = "x"; b.textContent = "\u00d7";
      b.title = "Cerrar este borrador";
      b.setAttribute("aria-label", "Cerrar " + (x.tab || x.id));
      b.addEventListener("click", function(ev){ ev.preventDefault(); cerrar(x); });
      cont.appendChild(b);
      nav.appendChild(cont);
    });
  }

  /* Un borrador cerrado desde otra sesion no esta en este localStorage.
     La base lo sabe: se pregunta una vez y se cachea para el proximo arranque.
     Devuelve una promesa con tope de 2 s, porque elegir() la espera. */
  function reconciliar(){
    return new Promise(function(res){
      var tope = setTimeout(res, 2000);
      function fin(){ clearTimeout(tope); res(); }
      if(!(window.claude && typeof window.claude.use === "function")) return fin();
      window.claude.use("db").then(function(db){
        if(!db) return fin();
        db.collection("drafts").get().then(function(snap){
          var cs = leerCerrados(), cambio = false;
          snap.docs.forEach(function(doc){
            var v = doc.data() || {};
            if(v.cerrado && cs.indexOf(doc.id) < 0){ cs.push(doc.id); cambio = true; }
          });
          if(cambio){ guardarCerrados(cs); pintar(); }
          fin();
        }, fin);
      }, fin);
    });
  }

  /* Todo cerrado: la pagina queda vacia en vez de mostrar un borrador ya mandado. */
  function vacio(){
    actual = "";
    pintar();
    var h = document.getElementById("titulo");
    if(h) h.textContent = "No hay borradores abiertos";
    document.title = "Versiones";
    var p = document.getElementById("sub");
    if(p) p.textContent = "Cerraste todos. El próximo que publique Claude aparece acá.";
    var ocultar = document.querySelectorAll(".deck, .rows, .fulls, .assembled, #thread, footer.bar");
    for(var i = 0; i < ocultar.length; i++) ocultar[i].hidden = true;
    var css = document.createElement("style");
    css.textContent = ".deck,.rows,.assembled,footer.bar{display:none!important}";
    document.head.appendChild(css);
  }

  function cargar(id){
    actual = id;
    ssSet(ABIERTO, id);
    marcarVisto(id);
    pintar();
    fetch("d/" + encodeURIComponent(id) + ".json")
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(dr){
        document.getElementById("draft").textContent = JSON.stringify(dr);
        var s = document.createElement("script");
        s.src = "app.js";
        /* Vuelve a la altura donde estaba en este borrador, en esta pestaña. Directo y no
           con requestAnimationFrame: ese no corre con la pestaña en segundo plano, que es
           justo cuando suele llegar una republicacion. */
        s.onload = function(){
          var y = +(ssGet(SCROLL + id) || 0);
          if(y > 0) window.scrollTo(0, y);
        };
        document.body.appendChild(s);
      })
      .catch(function(){
        var h = document.getElementById("titulo");
        if(h) h.textContent = "No se pudo abrir este borrador";
        var p = document.getElementById("sub");
        if(p) p.textContent = "Falta d/" + id + ".json. Elegí otro borrador arriba, o pedile " +
                              "a Claude que lo reconstruya.";
        pintar();
      });
  }

  /* Con ?d= explicito se abre ese, cerrado o no. Sin ?d= se abre el que esta pestaña tenia
     abierto si sigue abierto; si no, el DEFECTO si sigue abierto; si no, el primero
     abierto; si no queda ninguno, la pagina vacia. */
  var pedido = qs.get("d");
  var indiceListo = fetch("d/index.json").then(function(r){ return r.ok ? r.json() : {drafts:[]}; })
    .catch(function(){ return {drafts:[]}; })
    .then(function(ix){
      INDICE = ix || {drafts:[]};
      /* Primera vez en este navegador: nada se marca como nuevo. */
      if(leerVistos() === null) guardarVistos((INDICE.drafts || []).map(function(x){ return x.id; }));
    });

  try{ history.scrollRestoration = "manual"; }catch(e){}
  var tScroll = null;
  window.addEventListener("scroll", function(){
    if(!actual) return;
    clearTimeout(tScroll);
    tScroll = setTimeout(function(){ ssSet(SCROLL + actual, String(Math.round(window.scrollY))); }, 150);
  }, {passive:true});

  if(pedido){
    cargar(pedido);
    indiceListo.then(function(){ pintar(); if((INDICE.drafts || []).length > 1) reconciliar(); });
  } else {
    actual = "";
    indiceListo.then(function(){
      return reconciliar().then(function(){
        var abiertos = vivos();
        if(!abiertos.length) return vacio();
        function buscar(id){ return abiertos.filter(function(x){ return x.id === id; })[0]; }
        var elegido = buscar(ssGet(ABIERTO)) || buscar(DEFECTO) || abiertos[0];
        cargar(elegido.id);
      });
    });
  }
})();
</script>
<script>
(function(){
  "use strict";
  var DRAFT = JSON.parse(document.getElementById("draft").textContent);
  var KEYS = ["completa","ajustada","minima"];
  var LABEL = {completa:"Completa", ajustada:"Ajustada", minima:"Mínima", quitar:"Quitar"};
  var SOLO = "__solo";
  var CANAL = {
    email:      {que:"correo",    eyebrow:"Correo",          manda:true},
    whatsapp:   {que:"mensaje",   eyebrow:"WhatsApp",        manda:false},
    teams:      {que:"mensaje",   eyebrow:"Microsoft Teams", manda:false},
    dm:         {que:"mensaje",   eyebrow:"Mensaje directo", manda:false},
    formulario: {que:"respuesta", eyebrow:"Formulario",      manda:false}
  };
  /* Ajustes del usuario (config.json), que build.py copia en cada borrador. Sin envio de
     correo (envioEmail false: gws falta o el usuario no lo quiere) el email termina en
     Copiar como los demas canales. Los defaults solo cubren un borrador construido sin
     ajustes, y son los mismos de config.py. */
  var AJUSTES = DRAFT.ajustes || {};
  if(AJUSTES.envioEmail === false) CANAL.email.manda = false;
  var MSGS = DRAFT.mensajes;
  var HILO = !!DRAFT.hilo;
  var STORE = "versiones:" + DRAFT.draftId;
  var MARCADOR = /\{([A-Z0-9_]+)\}/g;
  var ZW = /\u200b/g;

  var msgById = {}, secById = {};
  MSGS.forEach(function(m){
    msgById[m.id] = m;
    secById[m.id] = {};
    m.secciones.forEach(function(s){ secById[m.id][s.id] = s; });
  });
  var activo = MSGS[0].id;
  function MSG(){ return msgById[activo]; }
  function C(){ return CANAL[MSG().canal] || CANAL.dm; }

  /* ---------------- estado ---------------- */
  /* sucio: secciones con texto bajado del DOM que todavia no fue a la base. */
  var state = {}, general = {}, sucio = {};
  MSGS.forEach(function(m){
    state[m.id] = {};
    m.secciones.forEach(function(s){
      state[m.id][s.id] = {pick:s.recomendada, ediciones:{}, nota:"", unida:false};
    });
    general[m.id] = {nota:"", listo:false, envio:null};
  });

  function validPick(s, k){ return KEYS.indexOf(k) >= 0 || (k === "quitar" && s.opcional); }
  /* Una edicion por version: el usuario puede ajustar la corta, pasarse a la completa, ajustarla
     tambien, y volver a la corta sin perder nada. textoEditado/editadoDe siguen viajando a la
     base como la edicion de la version elegida, para que registro.py y ENVIO.md no cambien.
     Un doc viejo sin ediciones trae solo ese par. Si los dos vienen, el par manda: es lo que
     corrige Claude desde el chat (paso 8 de ENVIO.md). */
  function leerEdiciones(d){
    var e = {};
    if(d.ediciones && typeof d.ediciones === "object"){
      KEYS.forEach(function(k){
        if(typeof d.ediciones[k] === "string" && d.ediciones[k]) e[k] = d.ediciones[k];
      });
    }
    if(typeof d.textoEditado === "string" && d.textoEditado && KEYS.indexOf(d.editadoDe) >= 0)
      e[d.editadoDe] = d.textoEditado;
    return e;
  }

  try{
    var saved = JSON.parse(localStorage.getItem(STORE) || "null");
    if(saved && saved.rev === DRAFT.rev && saved.mensajes){
      MSGS.forEach(function(m){
        var sm = saved.mensajes[m.id];
        if(!sm) return;
        m.secciones.forEach(function(s){
          var d = sm.secciones && sm.secciones[s.id];
          if(!d) return;
          if(validPick(s, d.pick)) state[m.id][s.id].pick = d.pick;
          state[m.id][s.id].ediciones = leerEdiciones(d);
          state[m.id][s.id].nota = d.nota || "";
          state[m.id][s.id].unida = !!d.unida;
        });
        general[m.id].nota = sm.nota || "";
        general[m.id].listo = !!sm.listo;
        general[m.id].envio = sm.envio || null;
      });
      if(saved.activo && msgById[saved.activo]) activo = saved.activo;
    }
  }catch(e){}

  function saveLocal(){
    try{
      var ms = {};
      MSGS.forEach(function(m){
        var secs = {};
        m.secciones.forEach(function(s){ secs[s.id] = state[m.id][s.id]; });
        ms[m.id] = {secciones:secs, nota:general[m.id].nota, listo:general[m.id].listo,
                    envio:general[m.id].envio};
      });
      localStorage.setItem(STORE, JSON.stringify({rev:DRAFT.rev, activo:activo, mensajes:ms}));
    }catch(e){}
  }

  /* ---------------- markdown ---------------- */
  function esc(t){
    return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  var INLINE = [
    {re:/\*\*(.+?)\*\*/g, tag:"strong"},
    {re:/(^|[\s(¡¿"'])\*([^*\s](?:[^*]*[^*\s])?)\*/g, tag:"em", lead:true},
    {re:/(^|[\s(¡¿"'])_([^_\s](?:[^_]*[^_\s])?)_/g, tag:"em", lead:true},
    {re:/~~(.+?)~~/g, tag:"s"},
    {re:/`([^`]+)`/g, tag:"code"}
  ];
  function inlineToHtml(t){
    var h = esc(t);
    INLINE.forEach(function(r){
      h = h.replace(r.re, function(){
        var a = arguments;
        return r.lead ? a[1] + "<" + r.tag + ">" + a[2] + "</" + r.tag + ">"

      if(!dentro) continue;
      var largo = g.n === 2 ? dentro.length + 2 : m[0].length;
      return envolver(raiz, node, corte - largo, corte, g.tag, dentro,
                      node.data.slice(corte - largo, corte));
    }
    /* apertura recien tecleada: el cierre ya estaba adelante */
    for(i = 0; i < REGLAS_ABRE.length; i++){
      g = REGLAS_ABRE[i];
      if(antes.slice(-g.abre.length) !== g.abre) continue;
      var previo = antes.slice(0, antes.length - g.abre.length);
      if(previo.slice(-1) === g.abre.slice(-1)) continue;
      if(g.borde && previo && !/[\s(¡¿"']$/.test(previo)) continue;
      m = g.re.exec(despues);
      if(!m || !m[1]) continue;
      return envolver(raiz, node, corte - g.abre.length, corte + m[0].length,
                      g.tag, m[1], g.abre + m[0]);
    }
    return false;
  }
  /* el caret esta pegado al final de `nodo`, con nada mas que \u200b de por medio */
  function caretJustoDespues(nodo, r){
    var c = r.startContainer, o = r.startOffset, n;
    if(c.nodeType === 3){
      if(c.data.slice(0, o).replace(ZW, "") !== "") return false;
      n = c;
    }else if(o > 0){
      var prev = c.childNodes[o - 1];
      if(prev === nodo) return true;
      if(!prev || prev.textContent.replace(ZW, "") !== "") return false;
      n = prev;
    }else n = c;
    var vueltas = 0;
    while(n && vueltas++ < 30){
      var p = n.previousSibling;
      while(p && p !== nodo && p.textContent.replace(ZW, "") === "") p = p.previousSibling;
      if(p) return p === nodo;
      n = n.parentNode;
      if(n === nodo) return true;
    }
    return false;
  }
  /* Backspace pegado a una marca recien puesta la devuelve a sus asteriscos. */
  function deshacerMarca(raiz){
    if(!ultimaMarca || ultimaMarca.raiz !== raiz) return false;
    var nodo = ultimaMarca.nodo;
    if(!nodo || !nodo.parentNode || !raiz.contains(nodo)){ ultimaMarca = null; return false; }
    var sel = window.getSelection();
    if(!sel || !sel.rangeCount) return false;
    var r = sel.getRangeAt(0);
    if(!r.collapsed || !caretJustoDespues(nodo, r)) return false;
    var padre = nodo.parentNode;
    var rr = document.createRange();
    rr.setStartAfter(nodo);
    rr.setEnd(r.startContainer, r.startOffset);
    rr.deleteContents();
    var txt = document.createTextNode(ultimaMarca.md);
    padre.replaceChild(txt, nodo);
    var sobras = raiz.querySelectorAll("span");
    for(var i = 0; i < sobras.length; i++){
      if(!sobras[i].textContent.replace(ZW, "") && sobras[i].parentNode)
        sobras[i].parentNode.removeChild(sobras[i]);
    }
    var pos = txt.data.length, sig = txt.nextSibling, ant = txt.previousSibling;
    if(sig && sig.nodeType === 3){ txt.appendData(sig.data); txt.parentNode.removeChild(sig); }
    if(ant && ant.nodeType === 3){
      pos += ant.data.length; ant.appendData(txt.data);
      txt.parentNode.removeChild(txt); txt = ant;
    }
    var cr = document.createRange();
    cr.setStart(txt, Math.min(pos, txt.data.length)); cr.collapse(true);
    sel.removeAllRanges(); sel.addRange(cr);
    ultimaMarca = null;
    return true;
  }
  /* El \u200b que cierra una marca es invisible: si Backspace se lo come solo,
     la tecla parece muerta. Se saca aqui y el navegador borra el de verdad. */
  function comerZW(dir){
    var sel = window.getSelection();
    if(!sel || !sel.rangeCount) return false;
    var r = sel.getRangeAt(0);
    if(!r.collapsed || r.startContainer.nodeType !== 3) return false;
    var node = r.startContainer, o = r.startOffset, n = 0;
    if(dir < 0){
      while(o - n > 0 && node.data.charCodeAt(o - n - 1) === 0x200b) n++;
      if(!n) return false;
      node.deleteData(o - n, n); o -= n;
    }else{
      while(o + n < node.data.length && node.data.charCodeAt(o + n) === 0x200b) n++;
      if(!n) return false;
      node.deleteData(o, n);
    }
    var cont = node, idx = o;
    if(!node.data && node.parentNode && node.parentNode.nodeName === "SPAN" &&
       !node.parentNode.textContent){
      var papa = node.parentNode;
      cont = papa.parentNode;
      idx = Array.prototype.indexOf.call(cont.childNodes, papa);
      cont.removeChild(papa);
    }
    var rr = document.createRange();
    rr.setStart(cont, idx); rr.collapse(true);
    sel.removeAllRanges(); sel.addRange(rr);
    return true;
  }
  function bloqueDe(node, raizEl){
    var n = node.nodeType === 3 ? node.parentNode : node;
    while(n && n !== raizEl && !/^(DIV|P|LI)$/.test(n.nodeName)) n = n.parentNode;
    return n === raizEl ? null : n;
  }
  function aplicarLista(raizEl){
    var sel = window.getSelection();
    if(!sel || !sel.rangeCount) return false;
    var r = sel.getRangeAt(0);
    if(!r.collapsed) return false;
    var bl = bloqueDe(r.startContainer, raizEl);
    if(!bl || bl.nodeName === "LI") return false;
    var t = bl.textContent.replace(ZW, "");
    var m = /^([-*+]|\d+[.)])\s$/.exec(t);
    if(!m) return false;
    var lista = document.createElement(/\d/.test(m[1]) ? "ol" : "ul");
    var li = document.createElement("li");
    li.appendChild(document.createElement("br"));
    lista.appendChild(li);
    if(!bl.parentNode) return false;
    bl.parentNode.replaceChild(lista, bl);
    var rr = document.createRange();
    rr.setStart(li, 0); rr.collapse(true);
    sel.removeAllRanges(); sel.addRange(rr);
    return true;
  }
  /* Chrome mete style="letter-spacing:..." en lo que inserta. Lo saca. */
  function limpiarEstilos(el){
    var sucios = el.querySelectorAll("[style]");
    for(var i = 0; i < sucios.length; i++) sucios[i].removeAttribute("style");
  }

  /* Teclas de formato, iguales en la tarjeta y en lo que sale. alCambiar baja el texto. */
  function teclas(ev, el, alCambiar){
    if(!ev.metaKey && !ev.ctrlKey && !ev.altKey){
      if(ev.key === "Backspace"){
        if(deshacerMarca(el)){
          ev.preventDefault();
          alCambiar();
          return;
        }
        comerZW(-1);   /* sin preventDefault: el borrado lo hace el navegador */
      }else if(ev.key === "Delete") comerZW(1);
    }
    var cmd = ev.metaKey || ev.ctrlKey;
    if(!cmd) return;
    var kk = ev.key.toLowerCase();
    var orden = kk === "b" ? "bold" : kk === "i" ? "italic"
              : (kk === "x" && ev.shiftKey) ? "strikeThrough" : kk === "e" ? "code" : null;
    if(!orden) return;
    ev.preventDefault();
    if(orden === "code") envolverCodigo();
    else document.execCommand(orden);
    limpiarEstilos(el);
    alCambiar();
  }
  function pegarTexto(ev, el){
    ev.preventDefault();
    var t = (ev.clipboardData || window.clipboardData).getData("text/plain");
    if(/\*\*|~~|`|^\s{0,3}(?:[-*+]|\d+[.)])\s/m.test(t)){
      document.execCommand("insertHTML", false, mdToHtml(t));
      limpiarEstilos(el);
    }else{
      document.execCommand("insertText", false, t);
    }
  }

  /* ---------------- lo que sale, editable ---------------- */
  /* Cada seccion que sale es su propia caja editable (.seg). Lo que el usuario escribe ahi se guarda
     como el ajuste de la version elegida de esa seccion, igual que si lo escribiera en la
     tarjeta, y la tarjeta se pone al dia en la misma tecla. Los marcadores se ven con su
     valor pero son una pieza sola (contenteditable=false): al bajar el texto vuelven a ser
     {MARCADOR}, asi el valor no queda escrito a mano. */
  var outSegs = {}, costuras = {};
  function htmlSalida(t){
    var h = mdToHtml(t).replace(/(<div><br><\/div>)+/g, '<div class="gap"></div>');
    return h.replace(MARCADOR, function(m, k){
      var mk = DRAFT.marcadores[k];
      if(!mk) return m;
      return '<span class="mk" contenteditable="false" data-k="' + k +
             '" title="{' + k + '}: se cambia desde el chat">' + esc(String(mk.valor)) + '</span>';
    });
  }
  function linkificar(el){
    el.querySelectorAll("div").forEach(function(d){
      if(d.querySelector("[data-k]")) return;
      var t = d.textContent.trim();
      if(/^https?:\/\/\S+$/.test(t)){
        var a = document.createElement("a");
        a.href = t; a.textContent = t; a.rel = "noopener"; a.target = "_blank";
        d.textContent = ""; d.appendChild(a);
      }
    });
  }
  /* La estructura (que secciones salen y cuales van pegadas) se rearma solo cuando cambia.
     El texto de cada caja se repinta si no tiene el foco: asi escribir en una no la pisa. */
  function pintarSalida(){
    var vs = visibles(activo);
    /* Se rearma solo si cambia que secciones salen. Pegar o despegar cambia clases en el
       lugar: rearmar mientras el usuario escribe le saca el cursor de la caja. */
    var clave = activo + "|" + vs.map(function(s){ return s.id; }).join(",");
    if(outEl._clave !== clave){
      outEl._clave = clave;
      outEl.textContent = "";
      outSegs = {}; costuras = {};
      vs.forEach(function(s, i){
        if(i > 0){
          var cos = document.createElement("div"); cos.className = "costura";
          var b = document.createElement("button"); b.type = "button";
          b.title = "Pegar " + s.nombre + " al párrafo anterior";
          b.setAttribute("aria-label", b.title);
          b.addEventListener("click", function(){ unir(s, true); });
          cos.appendChild(b); outEl.appendChild(cos);
          costuras[s.id] = cos;
        }
        var seg = armarSeg(s);
        outEl.appendChild(seg);
        outSegs[s.id] = seg;
      });
    }
    vs.forEach(function(s, i){
      var seg = outSegs[s.id], sig = vs[i + 1], cos = costuras[s.id];
      if(!seg) return;
      var pg = pegada(activo, s);
      seg.className = "seg" + (pg ? " pegada" : "") + (sig && pegada(activo, sig) ? " pega-sig" : "");
      if(cos){
        cos.hidden = pg;
        cos.firstChild.hidden = !puedeUnir(activo, s);
      }
      if(document.activeElement === seg) return;
      var t = rawOf(activo, s);
      if(seg._md === t) return;
      seg._md = t;
      seg.innerHTML = htmlSalida(t);
      linkificar(seg);
    });
  }
  function armarSeg(s){
    var seg = document.createElement("div");
    seg.setAttribute("data-sec", s.id);
    seg.setAttribute("contenteditable", "true");
    seg.setAttribute("role", "textbox");
    seg.setAttribute("aria-multiline", "true");
    seg.setAttribute("aria-label", s.nombre + ", en lo que sale");
    seg.addEventListener("input", function(ev){
      if(marcando) return;
      ultimaMarca = null;
      var escribiendo = !ev.inputType || ev.inputType.indexOf("insert") === 0;
      if(escribiendo){
        if(!aplicarLista(seg)) aplicarInline(seg);
        limpiarEstilos(seg);
      }
      tomarSalida(s, seg);
      pronto("o:" + s.id, function(){ guardarSalida(s, seg); });
    });
    seg.addEventListener("blur", function(){
      ultimaMarca = null;
      clearTimeout(timers["o:" + s.id]);
      guardarSalida(s, seg);
    });
    seg.addEventListener("keydown", function(ev){
      if(costura(ev, s, seg)) return;
      teclas(ev, seg, function(){ tomarSalida(s, seg); });
    });
    seg.addEventListener("paste", function(ev){ pegarTexto(ev, seg); });
    return seg;
  }
  /* Baja lo escrito al estado y pone al dia la tarjeta de esa version. La tarjeta tiene que
     quedar igual en la misma tecla: soltarPendientes lee el texto desde ella. */
  function tomarSalida(s, seg){
    if(!seg.isConnected || outSegs[s.id] !== seg) return;
    var st = state[activo][s.id];
    if(st.pick === "quitar" || !fijarEdicion(s, st.pick, domToMd(seg))) return;
    var r = refs[s.id], p = r && r.txt[st.pick];
    if(p && document.activeElement !== p) p.innerHTML = mdToHtml(rawOf(activo, s));
  }
  function guardarSalida(s, seg){
    tomarSalida(s, seg);
    if(sucio[activo + "|" + s.id]) pushSec(activo, s.id);
    render();
  }
  /* El caret pegado al borde de la caja: nada escrito entre el caret y el principio (dir -1)
     o el final (dir 1). */
  function enBorde(seg, dir){
    var sel = window.getSelection();
    if(!sel || !sel.rangeCount || !sel.isCollapsed) return false;
    var r = sel.getRangeAt(0), rr = document.createRange();
    rr.selectNodeContents(seg);
    if(dir < 0) rr.setEnd(r.startContainer, r.startOffset);
    else rr.setStart(r.endContainer, r.endOffset);
    return rr.toString().replace(ZW, "") === "";
  }
  /* Unir es borrar el espacio entre dos secciones, como en cualquier editor: Backspace al
     principio de una la pega a la anterior, Delete al final de una pega la siguiente. Enter
     al principio de una seccion pegada la vuelve a separar. */
  function costura(ev, s, seg){
    if(ev.metaKey || ev.ctrlKey || ev.altKey || ev.shiftKey) return false;
    var vs = visibles(activo), i = vs.indexOf(s), sig = vs[i + 1];
    if(ev.key === "Backspace" && !pegada(activo, s) && puedeUnir(activo, s) && enBorde(seg, -1)){
      ev.preventDefault(); unir(s, true, s, false); return true;
    }
    if(ev.key === "Delete" && sig && !pegada(activo, sig) && puedeUnir(activo, sig) && enBorde(seg, 1)){
      ev.preventDefault(); unir(sig, true, s, true); return true;
    }
    if(ev.key === "Enter" && pegada(activo, s) && enBorde(seg, -1)){
      ev.preventDefault(); unir(s, false, s, false); return true;
    }
    return false;
  }
  /* foco/alFinal: en que caja y en que borde queda el caret despues de rearmar. */
  function unir(s, si, foco, alFinal){
    soltarPendientes();
    state[activo][s.id].unida = si;
    pushSec(activo, s.id);
    render();
    var seg = foco && outSegs[foco.id];
    if(!seg) return;
    seg.focus();
    var r = document.createRange();
    r.selectNodeContents(seg);
    r.collapse(!alFinal);
    var sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(r);
  }

  function envolverCodigo(){
    var sel = window.getSelection();
    if(!sel || !sel.rangeCount || sel.isCollapsed) return;
    var t = sel.toString();
    document.execCommand("insertHTML", false, "<code>" + esc(t) + "</code>\u200b");
  }

  /* Baja al estado (y a localStorage) lo que el usuario escribio en el DOM. No toca la base ni
     repinta: eso lo decide el que llama. Devuelve true si el estado cambio.
     Corre en cada tecla. Antes el texto vivia solo en el DOM hasta que el debounce o el blur
     lo bajaban, y cualquier repintado de esos 1,2 s se llevaba la edicion puesta: pasaba al
     clickear otra version, al cambiar de mensaje y al recargarse la pagina. */
  function capturarEdicion(s, k, p){
    if(state[activo][s.id].pick !== k) return false;
    return fijarEdicion(s, k, domToMd(p));
  }
  function fijarEdicion(s, k, nuevo){

    var hm = dosD(d.getHours()) + ":" + dosD(d.getMinutes());
    if(mismo(d, hoy)) return "hoy a las " + hm;
    if(mismo(d, man)) return "mañana a las " + hm;

  function confirmarEnvio(e){

  function horaDe(iso){

  }
  function desfase(mid){
    var e = general[mid].envio;

  function actualizarEnvio(){

    if(!viejo || viejo.estado === "enviado") return;
    /* Copia, no el objeto de la base: lo que llega por onSnapshot viene congelado y, en modo
       estricto, escribirle un campo tira TypeError. El boton quedaba muerto sin decir nada
       cada vez que el envio venia de la base y no de localStorage (2026-10-13). */
    var e = {};
    for(var k in viejo) e[k] = viejo[k];
    e.textoFinal = plainText(activo);
    e.actualizadoTs = new Date().toISOString();
    if(e.estado !== "pedido") e.desfasado = true;
    general[activo].envio = e;
    pushMsg(activo);
    render();
    /* "pedido" es un envio que Claude todavia no tomo: si no se le avisa, sale con el texto
       que tenga cuando le toque revisar, o no sale hasta la proxima vuelta. */
    if(e.desfasado) avisarClaude("reagendar", activo);
    else if(e.estado === "pedido") avisarClaude("envio " + (e.modo || ""), activo);
  }

    render();
  }

  /* La nota es UNA conversacion con Claude, no seis. En un hilo el boton cuenta las notas de
     todos los mensajes y un solo click las cierra todas: lo que el boton dice no es que quiere,
     dice CUANDO termino de pedirlo. Es lo unico de la barra que el guardado automatico no puede
     deducir solo. El mensaje donde esta parado tambien se marca, porque puede haber revisado
     los seis y dejado notas en dos. */
  function conNotas(){
    var t = [];
    MSGS.forEach(function(m){ if(pendientes(m.id)) t.push(m.id); });
    return t;
  }
  function hayNotas(){ return conNotas().length > 0; }
  /* Lo que el boton MUESTRA se mide solo sobre los mensajes que tienen nota. Si tambien
     contara el mensaje donde esta parado, cerrar el pedido en el 6 y despues abrir el 1
     volveria a pedirle que lo cierre, para siempre. */
  function notasListas(){
    var t = conNotas();
    for(var i = 0; i < t.length; i++) if(!general[t[i]].listo) return false;
    return true;
  }
  /* Lo que el boton ESCRIBE si incluye el mensaje activo: el click tambien dice "con este
     termine", aunque no le haya dejado nota. */
  function objetivosNotas(){
    var t = conNotas();
    if(t.indexOf(activo) < 0) t.push(activo);
    return t;
  }

  /* En un canal que Claude no manda, el copiado ES el cierre: es un acto deliberado y no
     significa otra cosa que "me llevo este texto para usarlo". Escribe el mismo registro que
     en email escribe "De una vez", asi que agendar.py y el paso 9 de SKILL.md no cambian. */
  function marcarCopiado(txt){
    var g = general[activo], nuevo = !g.envio;
    g.envio = { estado:"pedido", modo:"ahora", etiqueta:"de una vez",
                canal: MSG().canal, textoFinal: txt, ts: new Date().toISOString() };
    g.listo = true;
    pushMsg(activo);
    render();
    if(nuevo) confeti();
  }

  function resetear(){
    pidiendoReset = false;
    MSG().secciones.forEach(function(s){
      state[activo][s.id].pick = s.recomendada;
      state[activo][s.id].ediciones = {};
      state[activo][s.id].unida = false;
      pushSec(activo, s.id);
    });
    render();
  }
  function hayEdiciones(){
    var ss = MSG().secciones;
    for(var i = 0; i < ss.length; i++) if(edited(activo, ss[i]) || pegada(activo, ss[i])) return true;
    return false;
  }

  function siguiente(){
    var i = MSGS.indexOf(MSG());
    return i >= 0 && i + 1 < MSGS.length ? MSGS[i + 1] : null;
  }

  /* Los tres elementos que dependen del estado se crean UNA vez y se prenden o apagan. Antes
     se borraban y se volvian a crear en cada render, y un render disparado por el blur del
     texto (mousedown -> blur -> render -> nodo nuevo) se comia el click que venia en camino:
     "Actualizar el envio" y el ✕ del chip pedian dos clicks. */
  /* La barra se reacomoda cuando el blur del texto baja una edicion pendiente ("Actualizar el
     envio" aparece y corre todo hacia la izquierda), asi que entre el mousedown y el mouseup
     el boton ya no esta abajo del cursor y el click nunca llega. Estos dos actuan en
     pointerdown, que corre antes del blur, con guarda para no repetir con el click de atras. */
  /* Un error adentro de fn se muestra en el cartel de arriba. Sin esto el boton queda
     muerto sin decir nada: asi se escondio el TypeError de "Actualizar el envio" el
     2026-10-13, y la consola de adentro del iframe no se ve desde afuera. */
  function alApretar(btn, fn){
    var ultimo = 0;
    function correr(){
      try{ fn(); }
      catch(err){ marca("error: " + (err && err.message || err), true); }
    }
    btn.addEventListener("pointerdown", function(ev){
      if(ev.button) return;
      ultimo = Date.now();
      correr();
    });
    btn.addEventListener("click", function(){
      if(Date.now() - ultimo < 700) return;
      correr();
    });
  }

  var chipEl = null, chipTxt = null, chipX = null, updBtn = null, nextBtn = null, askEl = null;
  function armarBarra(){
    if(chipEl) return;
    chipEl = document.createElement("span");
    chipEl.className = "sent"; chipEl.id = "sent-chip"; chipEl.hidden = true;
    chipTxt = document.createTextNode("");
    chipX = document.createElement("button");
    chipX.type = "button"; chipX.className = "x"; chipX.title = "Cancelar"; chipX.textContent = "✕";
    alApretar(chipX, cancelarEnvio);
    chipEl.appendChild(chipTxt); chipEl.appendChild(chipX);

    updBtn = document.createElement("button");
    updBtn.type = "button"; updBtn.className = "btn primary"; updBtn.id = "upd-envio";
    updBtn.textContent = "Actualizar el envío"; updBtn.hidden = true;
    updBtn.title = "Guardá en el envío los cambios que hiciste después de aprobar";
    alApretar(updBtn, actualizarEnvio);

    nextBtn = document.createElement("button");
    nextBtn.type = "button"; nextBtn.className = "btn"; nextBtn.id = "next-msg";
    nextBtn.textContent = "Siguiente mensaje →"; nextBtn.hidden = true;
    nextBtn.addEventListener("click", function(){
      var s = siguiente();
      if(s) irA(s.id);
    });

    /* Un click de mas no le puede borrar un texto que escribio a mano. Vive en la misma
       barra y no en un dialogo: la decision es de dos palabras y el boton esta ahi al lado. */
    askEl = document.createElement("span");
    askEl.className = "ask"; askEl.id = "reset-ask"; askEl.hidden = true;
    askEl.appendChild(document.createTextNode("¿Borro tus ediciones?"));
    var si = document.createElement("button");
    si.type = "button"; si.className = "btn primary"; si.textContent = "Sí";
    si.addEventListener("click", resetear);
    var no = document.createElement("button");
    no.type = "button"; no.className = "btn"; no.textContent = "No";
    no.addEventListener("click", function(){ pidiendoReset = false; pintarPrimario(); });
    askEl.appendChild(si); askEl.appendChild(no);

    barActs.insertBefore(chipEl, barActs.firstChild);
    barActs.insertBefore(updBtn, chipEl.nextSibling);
    barActs.insertBefore(askEl, btnReset);
    barActs.appendChild(nextBtn);
  }

  /* La barra solo ofrece lo que Claude puede ejecutar. En un canal que el no manda no hay
     ningun boton de envio ni hoja de horarios: eso era ceremonia alrededor de un pbcopy. */
  function pintarPrimario(){
    armarBarra();
    var g = general[activo], sig = HILO ? siguiente() : null;
    var manda = C().manda, e = g.envio, n = hayNotas();

    /* "Volver a lo recomendado" reescribe todos los picks del mensaje de una. Despues de
       aprobar un envio eso deja el registro inconsistente sin que se note, asi que el boton
       se esconde. El resto de la pagina sigue editable a proposito. */
    if(e) pidiendoReset = false;
    btnReset.hidden = !!e || pidiendoReset;
    askEl.hidden = !pidiendoReset;

    var stale = false;
    if(e){
      var est = e.estado, txt;
      if(manda){
        txt = est === "enviado" ? "Enviado"
            : est === "confirmado" ? (e.modo === "ahora" ? "Claude lo está mandando" : "Agendado " + e.etiqueta)
            : (e.modo === "ahora" ? "Pedido: mandarlo de una vez"
              : e.modo === "claude" ? "Aprobado · Claude decide cuándo" : "Pedido: " + e.etiqueta);
        if(est !== "enviado"){
          if(e.desfasado){ txt += " · falta reagendar"; stale = true; }
          else if(e.actualizadoTs) txt += " · actualizado " + horaDe(e.actualizadoTs);
        }
      }else{
        /* Aca no hay nada esperando una hora: lo unico que puede salir mal es que siga
           editando despues de haber pegado el texto, y eso se arregla copiando de nuevo. */
        stale = est !== "enviado" && desfase(activo);
        txt = est === "enviado" ? "Entregado"
            : "Copiado " + horaDe(e.ts) +
              (stale ? " · cambió, copialo otra vez" : " · lo tomo de acá");
      }
      chipTxt.nodeValue = txt;
      chipEl.classList.toggle("is-stale", stale);
      chipX.hidden = est === "enviado";
      chipEl.hidden = false;
    }else{
      chipEl.hidden = true;
      chipEl.classList.remove("is-stale");
    }

    /* "Actualizar el envio" existe solo donde hay un .eml esperando una hora. */
    var hayUpd = !!e && manda && desfase(activo);
    updBtn.hidden = !hayUpd;

    var caraNotas = n && !notasListas();
    if(n){
      btnPrimary.hidden = false;
      btnPrimary.textContent = caraNotas ? "Pedir cambios" : "Pedido ✓";
      btnPrimary.title = "Avisale a Claude que ya dejaste tus notas" + (HILO ? " en el hilo" : "");
    }else if(manda && !e){
      btnPrimary.hidden = false;
      btnPrimary.textContent = "Aprobar";
      btnPrimary.title = "Elegir cuándo sale: ahora, que Claude decida, o un día y hora";
    }else{
      btnPrimary.hidden = true;
    }

    /* El boton de avanzar no espera a que el mensaje este listo: revisar los seis y decidir
       despues es el uso normal de un hilo. */
    nextBtn.hidden = !sig;

    /* Un solo principal a la vez, por prioridad. */
    var principal = caraNotas ? "notas"
                  : hayUpd    ? "upd"
                  : sig       ? "next"
                  : (!n && manda && !e)             ? "envio"
                  : (!n && !manda && (!e || stale)) ? "copiar" : "";
    var claseP = "btn";
    if(n) claseP += caraNotas ? " primary" : " ghost-done";
    else if(principal === "envio") claseP += " primary";
    btnPrimary.className = claseP;
    updBtn.className   = "btn" + (principal === "upd"    ? " primary" : "");
    nextBtn.className  = "btn" + (principal === "next"   ? " primary" : "");
    copyBtn.className  = "btn" + (principal === "copiar" ? " primary" : "");
    copyBtn.title = principal === "copiar"
      ? "Copialo y lo doy por cerrado" : "Copiar el mensaje al portapapeles";
  }

  btnPrimary.addEventListener("click", function(){
    soltarPendientes();
    if(!hayNotas()){ abrirSheet(); return; }
    var objetivos = objetivosNotas(), marcar = !notasListas();
    objetivos.forEach(function(mid){
      /* Al desmarcar no se tocan los mensajes ya aprobados: ahi listo:true lo puso el envio. */
      if(!marcar && general[mid].envio) return;
      general[mid].listo = marcar;
      pushMsg(mid);
    });
    render();
    if(marcar){ acuse(btnPrimary); avisarClaude("cambios", activo); }
  });

  /* ---------------- render ---------------- */
  function render(){
    var m = MSG();
    pintarCabeza();
    pintarHilo();

    m.secciones.forEach(function(s){
      var r = refs[s.id], st = state[activo][s.id];
      if(!r) return;
      r.card.querySelectorAll(".opt").forEach(function(card){
        var ko = card.getAttribute("data-opt");
        card.setAttribute("aria-pressed", ko === st.pick ? "true" : "false");
        if(ko !== "quitar"){
          var ed = st.ediciones[ko];
          card.querySelector(".wc").textContent = words(ed || s.opts[ko].text) + " pal." + (ed ? " · editada" : "");
        }
      });
      KEYS.forEach(function(k){
        var p = r.txt[k];
        if(!p) return;
        var activoEl = document.activeElement === p;
        if(k === st.pick){
          if(p.getAttribute("contenteditable") !== "true") p.setAttribute("contenteditable", "true");
          if(!activoEl){
            var t = rawOf(activo, s);
            if(domToMd(p) !== t) p.innerHTML = mdToHtml(t);
          }
        }else{
          p.removeAttribute("contenteditable");
          if(!activoEl){
            var v = st.ediciones[k] || view(s.opts[k].text);
            if(domToMd(p) !== v) p.innerHTML = mdToHtml(v);
          }
        }
      });
      if(document.activeElement !== r.nota && r.nota.value !== st.nota) r.nota.value = st.nota;
      if(st.nota.trim() && r.box.hidden) r.box.hidden = false;
      var marcas = [];
      if(st.pick !== "quitar"){
        s.opts[st.pick].text.replace(MARCADOR, function(mm, k){
          var mk = DRAFT.marcadores[k];
          if(mk) marcas.push("{" + k + "} = " + mk.valor);
          return mm;
        });
      }
      r.hint.hidden = marcas.length === 0;
      r.hint.textContent = marcas.join("   ");
      pintarChips(s);
    });

    if(document.activeElement !== taGeneral && taGeneral.value !== general[activo].nota)
      taGeneral.value = general[activo].nota;

    pintarSalida();
    var txt = plainText(activo);

    var w = sinMarcas(txt).trim().split(/\s+/).filter(Boolean).length;
    var base0 = versionWords("completa");
    tallyEl.textContent = w;
    var dd = w - base0;
    deltaEl.textContent = dd === 0 ? "igual que la completa"
                        : (dd < 0 ? dd + " vs. la completa" : "+" + dd + " vs. la completa");
    recipeEl.textContent = m.secciones.map(function(s){
      return (pegada(activo, s) ? "+" : "") + s.id + ":" + state[activo][s.id].pick + (edited(activo, s) ? "*" : "");
    }).join("  ");
    pintarPendientes();
    pintarPrimario();
  }

  /* ---------------- barra ---------------- */
  btnReset.addEventListener("click", function(){
    soltarPendientes();
    if(hayEdiciones()){ pidiendoReset = true; pintarPrimario(); return; }
    resetear();
  });

  copyBtn.addEventListener("click", function(){
    soltarPendientes();
    var txt = plainText(activo);
    var listo = function(msg){
      copyBtn.textContent = msg;
      setTimeout(function(){ copyBtn.textContent = "Copiar"; }, 2000);
    };
    try{
      navigator.clipboard.writeText(txt).then(function(){ listo("Copiado"); },
                                              function(){ seleccionar(listo); });
    }catch(err){ seleccionar(listo); }
    /* Si hay notas sin atender, copiar solo copia: mandan las notas. */
    if(!C().manda && !pendientes(activo)) marcarCopiado(txt);
  });

  function seleccionar(listo){
    try{
      var r = document.createRange(); r.selectNodeContents(outEl);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      outEl.scrollIntoView({block:"center"});
      listo("Seleccionado, Cmd+C");
    }catch(e){ listo("Copialo del recuadro"); }
  }

  var mPick = document.getElementById("m-pick"), mRead = document.getElementById("m-read");
  function setMode(leyendo){
    mPick.setAttribute("aria-pressed", leyendo ? "false" : "true");
    mRead.setAttribute("aria-pressed", leyendo ? "true" : "false");
    rowsEl.hidden = leyendo;
    fullsEl.hidden = !leyendo;
  }
  mPick.addEventListener("click", function(){ setMode(false); });
  mRead.addEventListener("click", function(){ setMode(true); });

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && sheet){ e.preventDefault(); cerrarSheet(); return; }
    var cmd = e.metaKey || e.ctrlKey;
    if(!cmd) return;
    if(e.shiftKey && e.key.toLowerCase() === "l"){ e.preventDefault(); alternarTema(); return; }
    if(e.key === "Enter"){ e.preventDefault(); btnPrimary.click(); return; }
  });

  /* Si la pagina se va (recarga, pestana escondida, artifact cerrado) la edicion en curso
     tiene que quedar escrita antes. */
  window.addEventListener("pagehide", soltarPendientes);
  document.addEventListener("visibilitychange", function(){
    if(document.hidden) soltarPendientes();
  });

  construir();
  render();
  conectar();
})();
</script>
